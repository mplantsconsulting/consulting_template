[project]
# 案件開始時に name / description を書き換える
name = "consulting-project"
version = "0.1.0"
description = "データ分析を伴うコンサルティング案件のワークスペース"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastexcel>=0.20.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
